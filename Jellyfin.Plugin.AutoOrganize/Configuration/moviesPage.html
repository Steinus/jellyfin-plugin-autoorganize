<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="utf-8">
    <title>Auto Organize - Фильмы</title>
</head>
<body>
<div id="AutoOrganizeMoviesPage" data-role="page" class="page type-interior pluginConfigurationPage" data-require="emby-input,emby-button,emby-select,emby-checkbox">
    <div data-role="content">
        <div class="content-primary">
            <form id="MoviesForm">
                <h2>Auto Organize — Фильмы</h2>

                <div class="checkboxContainer checkboxContainer-withDescription">
                    <label class="emby-checkbox-label"><input id="MoviesEnabled" type="checkbox" is="emby-checkbox" /><span>Включить автоорганизацию фильмов</span></label>
                </div>
                <div class="checkboxContainer checkboxContainer-withDescription">
                    <label class="emby-checkbox-label"><input id="MoviesDryRun" type="checkbox" is="emby-checkbox" /><span>Тестовый режим — не изменять файлы</span></label>
                </div>

                <div class="inputContainer"><label class="inputLabel" for="MoviesSource">Папка наблюдения</label><input id="MoviesSource" type="text" is="emby-input" /><div class="fieldDescription">Например: /volume25/Video2/Torrents/Movies</div></div>
                <div class="inputContainer"><label class="inputLabel" for="MoviesDestination">Каталог фильмов</label><input id="MoviesDestination" type="text" is="emby-input" /><div class="fieldDescription">Например: /volume25/Video2/Movies</div></div>
                <div class="inputContainer"><label class="inputLabel" for="MoviesMinimumFileAgeMinutes">Минимальный возраст файла, минут</label><input id="MoviesMinimumFileAgeMinutes" type="number" min="0" is="emby-input" /></div>
                <div class="inputContainer"><label class="inputLabel" for="MovieFolderTemplate">Шаблон папки фильма</label><input id="MovieFolderTemplate" type="text" is="emby-input" /></div>
                <div class="inputContainer"><label class="inputLabel" for="MovieFileTemplate">Шаблон имени файла</label><input id="MovieFileTemplate" type="text" is="emby-input" /></div>

                <div class="selectContainer"><label class="selectLabel" for="MoviesOperation">Метод переноса</label><select id="MoviesOperation" is="emby-select"><option value="Move">Переместить</option><option value="Copy">Копировать</option><option value="Hardlink">Hardlink</option></select></div>

                <div class="inputContainer"><label class="inputLabel" for="Language">Язык метаданных</label><input id="Language" type="text" is="emby-input" /></div>
                <div class="inputContainer"><label class="inputLabel" for="ReplaceColonWith">Заменять двоеточие на</label><input id="ReplaceColonWith" type="text" is="emby-input" /></div>

                <div class="checkboxContainer checkboxContainer-withDescription"><label class="emby-checkbox-label"><input id="UseJellyfinMetadataProviders" type="checkbox" is="emby-checkbox" /><span>Использовать провайдеры Jellyfin для названий</span></label></div>
                <div class="checkboxContainer checkboxContainer-withDescription"><label class="emby-checkbox-label"><input id="MoviesMoveAssociatedFiles" type="checkbox" is="emby-checkbox" /><span>Переносить субтитры, NFO и изображения</span></label></div>
                <div class="checkboxContainer checkboxContainer-withDescription"><label class="emby-checkbox-label"><input id="MoviesDeleteEmptyFolders" type="checkbox" is="emby-checkbox" /><span>Удалять пустые исходные папки</span></label></div>

                <button is="emby-button" type="submit" class="raised button-submit block emby-button"><span>Сохранить</span></button>
            </form>
        </div>
    </div>
<script type="text/javascript">
(function () {
    const pluginId = 'b0515a71-eba2-4cca-9670-6aedba961caa';
    const ids = ['MoviesSource','MoviesDestination','MoviesMinimumFileAgeMinutes','MovieFolderTemplate','MovieFileTemplate','MoviesOperation','Language','ReplaceColonWith'];
    const checks = ['MoviesEnabled','MoviesDryRun','UseJellyfinMetadataProviders','MoviesMoveAssociatedFiles','MoviesDeleteEmptyFolders'];

    document.querySelector('#AutoOrganizeMoviesPage').addEventListener('pageshow', function () {
        Dashboard.showLoadingMsg();
        ApiClient.getPluginConfiguration(pluginId).then(config => {
            ids.forEach(id => { document.querySelector('#' + id).value = config[id] ?? ''; });
            checks.forEach(id => { document.querySelector('#' + id).checked = !!config[id]; });
            Dashboard.hideLoadingMsg();
        });
    });

    document.querySelector('#MoviesForm').addEventListener('submit', function (e) {
        e.preventDefault();
        Dashboard.showLoadingMsg();
        ApiClient.getPluginConfiguration(pluginId).then(config => {
            ids.forEach(id => { config[id] = document.querySelector('#' + id).value; });
            config.MoviesMinimumFileAgeMinutes = parseInt(document.querySelector('#MoviesMinimumFileAgeMinutes').value || '0', 10);
            checks.forEach(id => { config[id] = document.querySelector('#' + id).checked; });
            return ApiClient.updatePluginConfiguration(pluginId, config);
        }).then(result => Dashboard.processPluginConfigurationUpdateResult(result));
        return false;
    });
}());
</script>
</div>
</body>
</html>
