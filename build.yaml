framework: "net10.0"
overview: "Import, rename and organize movies and TV episodes from watch folders."
description: >
  Auto Organize watches configurable source folders and safely imports movies
  and TV episodes into Jellyfin library folders. Movies, series and the activity
  log have separate configuration pages. It supports move, copy and hardlink
  operations, Windows/SMB-safe filenames, naming templates, dry-run mode,
  sidecar files, Jellyfin metadata providers, and scheduled execution.
category: "General"
owner: "Steinus"
artifacts:
- "Jellyfin.Plugin.AutoOrganize.dll"
changelog: >
  Added a manual Auto Organize button on the Logs page. The button starts the
  Jellyfin scheduled task, shows running progress, disables itself while the
  task is active, and refreshes the activity log when processing completes.
