overview: "Import, rename and organize movies and TV episodes from watch folders."
description: >
  Auto Organize watches configurable source folders and safely imports movies
  and TV episodes into Jellyfin library folders. It supports move, copy and
  hardlink operations, Windows/SMB-safe filenames, configurable naming templates,
  dry-run mode, associated subtitle/NFO files, and scheduled execution.
