name: build

on:
  push:
    branches: [ "main" ]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - name: Restore
        run: dotnet restore Jellyfin.Plugin.AutoOrganize.slnx
      - name: Build
        run: dotnet build Jellyfin.Plugin.AutoOrganize.slnx -c Release --no-restore
      - name: Regression test naming patterns
        run: dotnet run --project tools/PatternSmokeTest/PatternSmokeTest.csproj -c Release
      - name: Verify settings page scripts and controls
        run: node tools/check-settings-page.cjs
      - name: Package DLL
        uses: actions/upload-artifact@v4
        with:
          name: Jellyfin.Plugin.AutoOrganize
          path: Jellyfin.Plugin.AutoOrganize/bin/Release/net10.0/Jellyfin.Plugin.AutoOrganize.dll
